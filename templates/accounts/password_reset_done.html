{% extends "base.html" %}
{% block title %}Check your email{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm"><div class="card-body p-4">
      <h3 class="mb-3">Check your email</h3>
      <p>If an account exists for that email address, we have sent instructions to reset its password.</p>
      <a href="{% url 'login' %}" class="btn btn-primary">Back to login</a>
    </div></div>
  </div>
</div>
{% endblock %}
